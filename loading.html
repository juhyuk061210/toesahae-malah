<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>분석 중 | 퇴사해말아?</title>
<meta name="theme-color" content="#F3EFE4" />
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
<link rel="stylesheet" as="style" crossorigin
  href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="flow.css" />
</head>
<body>
<div class="shell">
  <main class="load">

    <p class="chip chip--rd load__chip"><i class="dot-live"></i>만세력 조판 중</p>

    <!-- 활자 도판 — 잉크 판 위에 일간(日干)을 앉힌다 -->
    <div class="load__art" aria-hidden="true">
      <svg viewBox="0 0 176 176" class="load__svg">
        <!-- 조판 격자 -->
        <g stroke="#E1DAC7" stroke-width="1" opacity=".1">
          <path d="M88 10 V166 M10 88 H166" />
        </g>

        <!-- 12지 눈금 -->
        <g stroke="#E1DAC7" stroke-width="1.4" opacity=".34" stroke-linecap="round">
          <path d="M88 14 V22" />
          <path d="M88 14 V22" transform="rotate(30 88 88)" />
          <path d="M88 14 V22" transform="rotate(60 88 88)" />
          <path d="M88 14 V22" transform="rotate(90 88 88)" />
          <path d="M88 14 V22" transform="rotate(120 88 88)" />
          <path d="M88 14 V22" transform="rotate(150 88 88)" />
          <path d="M88 14 V22" transform="rotate(180 88 88)" />
          <path d="M88 14 V22" transform="rotate(210 88 88)" />
          <path d="M88 14 V22" transform="rotate(240 88 88)" />
          <path d="M88 14 V22" transform="rotate(270 88 88)" />
          <path d="M88 14 V22" transform="rotate(300 88 88)" />
          <path d="M88 14 V22" transform="rotate(330 88 88)" />
        </g>

        <!-- 정지 괘선 -->
        <circle cx="88" cy="88" r="62" fill="none" stroke="#E1DAC7" stroke-width="1" opacity=".22" />
        <circle cx="88" cy="88" r="46" fill="none" stroke="#E1DAC7" stroke-width="1"
                opacity=".16" stroke-dasharray="2 5" />

        <!-- 도는 괘선 -->
        <circle class="load__ring" cx="88" cy="88" r="62" fill="none"
                stroke="#B02A1E" stroke-width="2.4" stroke-linecap="round"
                stroke-dasharray="62 328" />
        <circle class="load__ring2" cx="88" cy="88" r="46" fill="none"
                stroke="#E1DAC7" stroke-width="1.6" stroke-linecap="round"
                stroke-dasharray="34 255" opacity=".7" />

        <!-- 네 귀 표식 -->
        <g stroke="#B02A1E" stroke-width="1.8" fill="none" stroke-linecap="square">
          <path d="M9 21 V9 H21" />
          <path d="M155 9 H167 V21" />
          <path d="M167 155 V167 H155" />
          <path d="M21 167 H9 V155" />
        </g>
      </svg>

      <div class="load__core" id="core">甲</div>
      <span class="load__scan"></span>
    </div>

    <h2 class="load__title" id="ltitle">사주 원국을 확인하고 있어요</h2>
    <p class="load__name" id="lname"></p>

    <div class="load__meter">
      <div class="load__bar"><i id="lfill"></i></div>
      <p class="load__pct"><b id="lpct">0</b>%</p>
    </div>

    <ul class="load__steps" id="lsteps">
      <li><span></span>사주 원국을 확인하고 있어요</li>
      <li><span></span>직장에서 나타나는 성향을 분석하고 있어요</li>
      <li><span></span>현재 고민과 직장 흐름을 비교하고 있어요</li>
      <li><span></span>앞으로의 변화 흐름을 확인하고 있어요</li>
      <li><span></span>리포트를 완성하고 있어요</li>
    </ul>

    <p class="load__note">
      태어난 순간의 절기를 기준으로 사주를 세우고, 지금의 직장 상황과 겹쳐 읽는 중입니다.
    </p>

  </main>
</div>

<script src="config.js"></script>
<script src="site.js"></script>
<script src="solar-terms.js"></script>
<script src="lunar-table.js"></script>
<script src="saju.js"></script>
<script src="saju-deep.js"></script>
<script src="saju-analyze.js"></script>
<script src="saju-read.js"></script>
<script src="diagnosis.js"></script>
<script src="questions.js"></script>
<script src="bridge.js"></script>
<script src="tension.js"></script>
<script src="app.js"></script>
<script src="loading.js"></script>
</body>
</html>
